<style>
:root{--pearl:#fafaf8;--gold:#d8b56a;--gold2:#ad8340;--ink:#393631;--muted:#817a70;--pink:#f6c8d6;--mint:#bfe7dd;--lav:#d7c9f4;--sky:#c6e4f7;--card:rgba(255,255,255,.76);--serif:"Noto Serif TC",serif;--sans:"Noto Sans TC",system-ui,sans-serif;--latin:"Cormorant Garamond",serif}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}button,input{font:inherit}button{cursor:pointer;color:inherit}body{font-family:var(--sans);color:var(--ink);background:var(--pearl);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(55vw 55vw at 0 0,rgba(246,200,214,.48),transparent 62%),radial-gradient(52vw 48vw at 100% 0,rgba(198,228,247,.5),transparent 60%),radial-gradient(48vw 52vw at 100% 100%,rgba(215,201,244,.46),transparent 65%),radial-gradient(50vw 50vw at 0 100%,rgba(191,231,221,.45),transparent 62%),#fafaf8}

.app{min-height:100vh;max-width:1240px;margin:auto;padding:28px 34px 34px;display:flex;flex-direction:column;gap:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.eyebrow{font:600 13px var(--latin);letter-spacing:.3em;color:var(--gold2);text-transform:uppercase}.brand h1{font:700 clamp(27px,4vw,45px)/1.2 var(--serif);letter-spacing:.12em;margin:5px 0 0}.sub{font:italic 600 19px var(--latin);color:#766a58;margin-top:3px;letter-spacing:.06em}
.sound{border:1px solid rgba(216,181,106,.42);background:rgba(255,255,255,.7);border-radius:999px;padding:11px 17px;display:flex;gap:8px;align-items:center;box-shadow:0 8px 24px -18px #70541e;transition:.2s}.sound:hover{transform:translateY(-2px);background:#fff}.sound i{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(216,181,106,.2)}
.main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);gap:22px;flex:1}.card{background:var(--card);border:1px solid rgba(255,255,255,.95);border-radius:30px;box-shadow:0 26px 70px -38px rgba(91,68,24,.46);backdrop-filter:blur(16px)}
.stage{position:relative;min-height:640px;display:grid;place-items:center;overflow:hidden;padding:72px 28px 130px}.status{position:absolute;left:24px;top:23px;display:flex;gap:9px;align-items:center;padding:8px 14px;background:rgba(255,255,255,.82);border:1px solid rgba(57,54,49,.07);border-radius:999px;font-size:12px;letter-spacing:.12em;color:var(--muted)}.status i{width:8px;height:8px;border-radius:50%;background:#b9d9c9;box-shadow:0 0 0 4px rgba(185,217,201,.32)}.status.running i{background:var(--gold);animation:pulse 1s infinite}.status.done i{background:#e6a6bc;box-shadow:0 0 0 4px rgba(246,200,214,.5)}@keyframes pulse{50%{transform:scale(1.5)}}
.machine{position:relative;width:min(490px,88vw);aspect-ratio:.85;filter:drop-shadow(0 28px 25px rgba(92,69,27,.16))}.dome{position:absolute;left:15%;top:0;width:70%;height:62%;border-radius:50% 50% 25% 25%/52% 52% 18% 18%;background:linear-gradient(120deg,rgba(255,255,255,.75),rgba(227,237,246,.25) 32%,rgba(255,255,255,.08) 60%,rgba(197,211,229,.32));border:2px solid rgba(255,255,255,.8);box-shadow:inset 0 0 0 2px rgba(173,131,64,.18),inset 18px 8px 30px rgba(255,255,255,.36);overflow:hidden}.dome:after{content:"";position:absolute;left:12%;top:9%;width:18%;height:52%;border-radius:50%;background:linear-gradient(90deg,rgba(255,255,255,.8),transparent);transform:rotate(28deg)}
.balls{position:absolute;inset:14% 7% 6%}.ball{--c:var(--pink);position:absolute;width:26%;aspect-ratio:1;border-radius:50%;background:linear-gradient(to bottom,var(--c) 0 48%,#f9f6ef 49% 100%);box-shadow:inset -7px -9px 14px rgba(65,48,20,.1),inset 5px 5px 8px rgba(255,255,255,.5),0 7px 14px rgba(68,52,27,.14);transform:rotate(var(--r))}.ball:after{content:"";position:absolute;left:0;right:0;top:46%;height:7%;background:rgba(108,83,40,.12)}.b1{left:3%;top:55%;--c:var(--pink);--r:18deg}.b2{left:25%;top:61%;--c:var(--mint);--r:-8deg}.b3{left:50%;top:56%;--c:var(--lav);--r:13deg}.b4{left:68%;top:40%;--c:var(--sky);--r:-19deg}.b5{left:15%;top:32%;--c:#f7e5b5;--r:-12deg}.b6{left:43%;top:28%;--c:var(--pink);--r:22deg}.machine.running .ball{animation:tumble .75s ease-in-out infinite alternate}.machine.running .b2,.machine.running .b5{animation-delay:-.3s}.machine.running .b3,.machine.running .b6{animation-delay:-.55s}@keyframes tumble{to{translate:0 -14%;rotate:12deg}}
.body{position:absolute;left:8%;right:8%;top:50%;height:43%;border-radius:15% 15% 10% 10%/12% 12% 10% 10%;background:linear-gradient(115deg,#fff,#f3eee4 45%,#e3d9c7);border:1px solid rgba(216,181,106,.55);box-shadow:inset 0 2px 0 #fff}.body:before{content:"";position:absolute;left:0;right:0;top:0;height:13%;border-radius:999px;background:linear-gradient(90deg,#f6e7bf,#d8b56a,#ad8340,#efd9a2)}
.clock{position:absolute;z-index:4;left:15%;right:15%;top:58%;height:22%;border-radius:24px;background:rgba(255,253,248,.9);border:1px solid rgba(216,181,106,.55);box-shadow:inset 0 5px 15px rgba(94,70,28,.07),0 8px 18px rgba(94,70,28,.1);display:flex;align-items:center;justify-content:center;font:600 clamp(48px,7vw,78px)/1 var(--latin);letter-spacing:.04em;color:#51493e;font-variant-numeric:tabular-nums}.clock .colon{color:var(--gold2);animation:blink 1s steps(1) infinite}.paused .colon{animation:none}@keyframes blink{50%{opacity:.28}}
.knob{position:absolute;z-index:5;left:50%;top:83%;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7dd,#d8b56a 47%,#a97e35);box-shadow:0 7px 12px rgba(87,61,17,.25),inset 0 1px #fff}.knob:after{content:"";position:absolute;left:12%;right:12%;top:42%;height:16%;border-radius:999px;background:#fff4d5;box-shadow:0 2px 5px rgba(80,54,10,.3)}.machine.running .knob{animation:turn 1.8s linear infinite}@keyframes turn{to{transform:translate(-50%,-50%) rotate(360deg)}}
.tray{position:absolute;z-index:4;left:26%;right:26%;bottom:0;height:16%;border-radius:19px 19px 35px 35px;background:linear-gradient(#eee6d6,#fffaf0 55%,#d8cfbf);border:1px solid rgba(216,181,106,.6);box-shadow:inset 0 12px 18px rgba(88,62,18,.14)}
.finish-ball{position:absolute;z-index:7;left:42%;bottom:4%;width:16%;aspect-ratio:1;border-radius:50%;background:linear-gradient(to bottom,var(--pink) 0 48%,#faf7f1 49%);box-shadow:0 12px 18px rgba(75,54,17,.23);opacity:0}.machine.done .finish-ball{animation:popball 1s cubic-bezier(.15,.75,.25,1.2) forwards}@keyframes popball{0%{opacity:0;transform:translateY(-90px) scale(.3) rotate(-80deg)}55%{opacity:1;transform:translateY(0) scale(1.06) rotate(15deg)}75%{transform:translateY(-13px) scale(1) rotate(-5deg)}100%{opacity:1;transform:none}}
.controls{position:absolute;left:20px;right:20px;bottom:20px;display:flex;justify-content:center;gap:10px}.btn{border:1px solid rgba(57,54,49,.1);height:52px;padding:0 24px;border-radius:999px;background:rgba(255,255,255,.88);font-weight:500;letter-spacing:.1em;box-shadow:0 10px 22px -16px rgba(72,52,16,.45);transition:.2s}.btn:hover{transform:translateY(-2px)}.primary{min-width:190px;color:#fff;border:0;background:linear-gradient(135deg,#e2c47f,#c59a4d 48%,#a97e39);box-shadow:0 16px 30px -16px rgba(122,82,19,.75)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.panel{padding:28px;display:flex;flex-direction:column}.panel h2{font:700 25px var(--serif);letter-spacing:.12em;margin:0}.panel .en{font:italic 600 17px var(--latin);color:var(--gold2);margin-top:2px}.field{margin-top:25px}.label{display:block;color:var(--muted);font-size:13px;letter-spacing:.13em;margin-bottom:10px}.time-inputs{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:7px;align-items:center}.time-inputs input{width:100%;height:72px;text-align:center;border:1px solid rgba(216,181,106,.5);border-radius:17px;background:#fffcf5;font:600 38px var(--latin);outline:none}.time-inputs input:focus{box-shadow:0 0 0 4px rgba(216,181,106,.18);border-color:var(--gold)}.time-inputs b{font:600 30px var(--latin);color:var(--gold2)}.unit-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;text-align:center;margin-top:6px;color:var(--muted);font-size:11px;letter-spacing:.14em}.presets{display:flex;gap:8px;flex-wrap:wrap}.preset{height:38px;padding:0 14px;border-radius:999px;border:1px solid rgba(216,181,106,.34);background:white;font:600 15px var(--latin);transition:.2s}.preset:hover{background:#fff7e5;border-color:var(--gold)}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(216,181,106,.5),transparent);margin:26px 0}.tip{padding:18px;border-radius:18px;background:linear-gradient(135deg,rgba(246,200,214,.22),rgba(198,228,247,.22));font-size:13px;line-height:1.8;color:#6f685d}.tip strong{display:block;color:var(--gold2);letter-spacing:.1em;margin-bottom:3px}.progress{margin-top:auto;padding-top:24px}.track{height:8px;border-radius:999px;background:rgba(57,54,49,.07);overflow:hidden}.bar{height:100%;width:100%;border-radius:inherit;background:linear-gradient(90deg,#f6c8d6,#d8b56a,#bfe7dd);transition:width .3s linear}.progress p{font-size:12px;color:var(--muted);letter-spacing:.1em;text-align:center;margin:10px 0 0}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}.complete{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:rgba(250,250,248,.42);backdrop-filter:blur(7px);opacity:0;visibility:hidden;transition:.3s}.complete.show{opacity:1;visibility:visible}.complete-card{width:min(520px,100%);padding:38px;text-align:center;border-radius:30px;background:rgba(255,255,255,.95);border:1px solid rgba(216,181,106,.55);box-shadow:0 35px 80px -35px rgba(89,65,20,.55);transform:scale(.86);transition:.45s cubic-bezier(.2,.9,.25,1.2)}.complete.show .complete-card{transform:none}.capsule-icon{width:76px;height:76px;margin:auto;border-radius:50%;background:linear-gradient(to bottom,var(--pink) 0 48%,#f9f6ef 49%);box-shadow:0 12px 22px rgba(72,50,14,.18);position:relative}.capsule-icon:after{content:"";position:absolute;left:0;right:0;top:46%;height:8%;background:rgba(130,96,42,.15)}.complete h3{font:700 34px var(--serif);letter-spacing:.16em;margin:18px 0 4px}.complete .en{font:italic 600 20px var(--latin);color:var(--gold2)}.complete p{color:var(--muted);letter-spacing:.08em}.complete .btn{margin-top:14px}
/* ---------- Starlight hourglass ---------- */
.machine{width:min(470px,84vw);aspect-ratio:.9;filter:drop-shadow(0 28px 25px rgba(92,69,27,.16))}.orbit{position:absolute;left:7%;top:5%;width:86%;aspect-ratio:1;border:1px solid rgba(216,181,106,.34);border-radius:50%;transform:rotate(-13deg)}.orbit:before,.orbit:after{content:"";position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d8b56a 45%,#ad8340);box-shadow:0 0 16px rgba(216,181,106,.6)}.orbit:before{width:14px;height:14px;left:10%;top:18%}.orbit:after{width:9px;height:9px;right:8%;bottom:25%;background:radial-gradient(circle at 35% 30%,#fff,#d7c9f4 48%,#aa91d4)}.machine.running .orbit{animation:orbit 9s linear infinite}@keyframes orbit{to{transform:rotate(347deg)}}
.stars{position:absolute;inset:0}.stars i{position:absolute;width:5px;height:5px;border-radius:50%;background:#d8b56a;box-shadow:0 0 10px #d8b56a;animation:twinkle 1.8s ease-in-out infinite alternate}.stars i:nth-child(1){left:8%;top:40%}.stars i:nth-child(2){right:8%;top:25%;animation-delay:-.7s}.stars i:nth-child(3){right:14%;bottom:25%;animation-delay:-1.2s}.stars i:nth-child(4){left:17%;bottom:17%;animation-delay:-.3s}@keyframes twinkle{to{opacity:.2;transform:scale(.55)}}
.hourglass{position:absolute;left:19%;top:0;width:62%;height:75%}.hg-top,.hg-bottom{position:absolute;left:3%;right:3%;height:9%;border-radius:999px;background:linear-gradient(90deg,#f6e7bf,#d8b56a 30%,#ad8340 58%,#efd9a2 84%);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 8px 15px rgba(90,64,20,.16);z-index:3}.hg-top{top:0}.hg-bottom{bottom:0}.glass{position:absolute;left:14%;right:14%;top:7%;bottom:7%;filter:drop-shadow(0 8px 12px rgba(85,64,30,.1))}.glass:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,255,255,.85),rgba(220,235,244,.22) 35%,rgba(255,255,255,.12) 65%,rgba(202,216,231,.34));clip-path:polygon(0 0,100% 0,85% 34%,56% 50%,85% 66%,100% 100%,0 100%,15% 66%,44% 50%,15% 34%);border-radius:28px}.glass:after{content:"";position:absolute;inset:2px;background:linear-gradient(90deg,rgba(255,255,255,.7),transparent 25%);clip-path:polygon(4% 1%,96% 1%,81% 34%,53% 49%,81% 66%,96% 99%,4% 99%,19% 66%,47% 51%,19% 34%)}
.sand-top,.sand-bottom{position:absolute;left:18%;right:18%;overflow:hidden;z-index:2}.sand-top{top:15%;height:31%;clip-path:polygon(0 0,100% 0,70% 70%,52% 100%,48% 100%,30% 70%)}.sand-bottom{bottom:15%;height:31%;clip-path:polygon(50% 0,100% 100%,0 100%)}.sand-top:before,.sand-bottom:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#f7e5b5,#d8b56a 55%,#c69b4a);box-shadow:inset 0 0 14px rgba(255,255,255,.35)}.sand-top:before{transform:translateY(calc(var(--sand-progress,0) * -100%));transition:transform .3s linear}.sand-bottom:before{transform:translateY(calc((1 - var(--sand-progress,0)) * 100%));transition:transform .3s linear}.stream{position:absolute;z-index:4;left:calc(50% - 1px);top:45%;width:2px;height:28%;background:linear-gradient(#d8b56a,#f6df9e,transparent);opacity:0}.machine.running .stream{opacity:1;animation:stream .45s linear infinite}@keyframes stream{50%{opacity:.42}}
.clock{left:8%;right:8%;top:78%;height:15%;border-radius:999px;background:rgba(255,253,248,.94);font-size:clamp(48px,7vw,76px)}.machine.done .hourglass{animation:hourglassDone .85s cubic-bezier(.2,.9,.25,1.15)}@keyframes hourglassDone{50%{transform:translateY(-12px) scale(1.03)}100%{transform:none}}.machine.done .orbit{animation:glow 1s ease-in-out 2}@keyframes glow{50%{box-shadow:0 0 45px rgba(216,181,106,.55);transform:rotate(-13deg) scale(1.04)}}
.capsule-icon{background:radial-gradient(circle at 50% 50%,#fff 0 8%,#f6e7bf 10% 18%,#d8b56a 20% 30%,transparent 32%),conic-gradient(from 0deg,transparent 0 8%,#d8b56a 9% 11%,transparent 12% 23%,#d7c9f4 24% 27%,transparent 28% 40%,#d8b56a 41% 43%,transparent 44% 57%,#bfe7dd 58% 61%,transparent 62% 74%,#d8b56a 75% 78%,transparent 79%);box-shadow:none}.capsule-icon:after{display:none}
/* ---------- Fairytale cuckoo clock ---------- */
.machine{width:min(470px,84vw);aspect-ratio:.84;filter:drop-shadow(0 30px 28px rgba(92,69,27,.18))}.clock-house{position:absolute;left:15%;right:15%;top:5%;height:70%}.roof{position:absolute;z-index:6;left:-8%;right:-8%;top:0;height:27%;background:linear-gradient(145deg,#f6e7bf,#d8b56a 45%,#ad8340);clip-path:polygon(50% 0,100% 92%,92% 100%,50% 25%,8% 100%,0 92%);filter:drop-shadow(0 8px 8px rgba(90,62,15,.18))}.roof:after{content:"";position:absolute;left:47%;top:5%;width:6%;height:82%;border-radius:999px;background:rgba(255,255,255,.38);transform:rotate(-43deg);transform-origin:bottom}
.house-body{position:absolute;left:4%;right:4%;top:20%;bottom:0;border-radius:24px 24px 36px 36px;background:linear-gradient(120deg,#fffdf7,#f1e9da 58%,#dfd3bf);border:1px solid rgba(216,181,106,.6);box-shadow:inset 12px 10px 22px rgba(255,255,255,.72),inset -10px -12px 20px rgba(116,84,34,.09)}.house-body:before,.house-body:after{content:"";position:absolute;top:18%;bottom:8%;width:10px;border-radius:999px;background:linear-gradient(#f6e7bf,#c9a04f,#f0d79d)}.house-body:before{left:7%}.house-body:after{right:7%}
.cuckoo-box{position:absolute;z-index:8;left:31%;top:18%;width:38%;height:27%;perspective:240px}.cuckoo-inner{position:absolute;inset:10% 13%;border-radius:9px 9px 13px 13px;background:#76604b;box-shadow:inset 0 8px 13px rgba(35,24,12,.38)}.door{position:absolute;z-index:3;top:5%;width:50%;height:90%;background:linear-gradient(140deg,#f8e4b6,#c89d4c);border:1px solid rgba(120,81,24,.28);transition:transform .55s cubic-bezier(.2,.8,.2,1)}.door.left{left:0;border-radius:8px 2px 2px 8px;transform-origin:left}.door.right{right:0;border-radius:2px 8px 8px 2px;transform-origin:right}.machine.done .door.left{transform:rotateY(-112deg)}.machine.done .door.right{transform:rotateY(112deg)}
.bird{position:absolute;z-index:2;left:25%;top:24%;width:50%;height:53%;opacity:0;transform:translateY(10px) scale(.6);transition:.3s}.bird-body{position:absolute;left:15%;top:20%;width:70%;height:66%;border-radius:50% 55% 45% 45%;background:radial-gradient(circle at 35% 25%,#fff,#c6e4f7 50%,#9ec8df);box-shadow:inset -5px -6px 9px rgba(65,82,100,.12)}.bird-body:before{content:"";position:absolute;right:12%;top:25%;width:8px;height:8px;border-radius:50%;background:#554c43;box-shadow:0 0 0 3px #fff}.bird-body:after{content:"";position:absolute;right:-18%;top:37%;border-left:14px solid #d8b56a;border-top:7px solid transparent;border-bottom:7px solid transparent}.wing{position:absolute;left:4%;top:45%;width:43%;height:28%;border-radius:80% 20% 70% 30%;background:#d7c9f4;transform-origin:right center}.machine.done .bird{animation:birdOut 2.8s .42s ease-in-out forwards}.machine.done .wing{animation:wing .18s .55s ease-in-out 8 alternate}@keyframes birdOut{0%{opacity:0;transform:translateY(12px) scale(.6)}18%,72%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(8px) scale(.72)}}@keyframes wing{to{transform:rotate(-35deg)}}
.dial{position:absolute;z-index:5;left:21%;right:21%;top:39%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fffdf8 0 58%,#efe4cf 59% 67%,#d8b56a 68% 73%,#ad8340 74% 78%,#f3dfaa 79%);box-shadow:0 10px 18px rgba(86,59,17,.16),inset 0 0 0 1px rgba(255,255,255,.8)}.dial .mark{position:absolute;left:49%;top:8%;width:2%;height:7%;border-radius:999px;background:#7b6648;transform-origin:50% 600%}.dial .m2{transform:rotate(30deg)}.dial .m3{transform:rotate(60deg)}.dial .m4{transform:rotate(90deg)}.dial .m5{transform:rotate(120deg)}.dial .m6{transform:rotate(150deg)}.dial .m7{transform:rotate(180deg)}.dial .m8{transform:rotate(210deg)}.dial .m9{transform:rotate(240deg)}.dial .m10{transform:rotate(270deg)}.dial .m11{transform:rotate(300deg)}.dial .m12{transform:rotate(330deg)}
.hand{position:absolute;z-index:3;left:49%;bottom:50%;width:2%;border-radius:999px;background:#69583f;transform-origin:50% 100%}.hand.hour{height:25%;transform:rotate(25deg)}.hand.minute{height:34%;transform:rotate(145deg)}.hand-center{position:absolute;z-index:4;left:45.5%;top:45.5%;width:9%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d8b56a 50%,#ad8340)}.machine.running .hand.minute{animation:handTurn 12s linear infinite}.machine.running .hand.hour{animation:handTurn 48s linear infinite}@keyframes handTurn{to{transform:rotate(505deg)}}
.digital-window{position:absolute;z-index:7;left:23%;right:23%;bottom:6%;height:16%;border-radius:999px;background:rgba(255,253,248,.96);border:1px solid rgba(216,181,106,.48);box-shadow:inset 0 4px 10px rgba(84,59,19,.07);display:flex;align-items:center;justify-content:center;font:600 clamp(32px,5vw,50px)/1 var(--latin);letter-spacing:.04em;font-variant-numeric:tabular-nums}.digital-window .colon{color:var(--gold2);animation:blink 1s steps(1) infinite}.paused .digital-window .colon{animation:none}
.pendulum-rod{position:absolute;z-index:1;left:49.4%;top:68%;width:1.2%;height:23%;border-radius:999px;background:linear-gradient(90deg,#ad8340,#f5dd9f,#ad8340);transform-origin:50% 0}.pendulum-bob{position:absolute;left:50%;bottom:-24px;width:66px;height:66px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff3ce,#d8b56a 45%,#9e7130);box-shadow:0 9px 16px rgba(83,54,14,.25),inset 0 1px 0 rgba(255,255,255,.7)}.machine.running .pendulum-rod{animation:pendulum 1.4s ease-in-out infinite alternate}.machine.paused .pendulum-rod,.machine.done .pendulum-rod{transform:rotate(0)}@keyframes pendulum{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.clock-chain{position:absolute;z-index:0;top:69%;width:2px;height:22%;background:repeating-linear-gradient(to bottom,#ad8340 0 3px,transparent 3px 7px)}.clock-chain.left{left:32%}.clock-chain.right{right:32%}.weight{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);width:22px;height:36px;border-radius:50% 50% 44% 44%;background:linear-gradient(90deg,#ad8340,#f1d28b,#ad8340);clip-path:polygon(50% 0,100% 45%,78% 100%,22% 100%,0 45%)}
.machine.done .clock-house{animation:clockChime .28s ease-in-out 5 alternate}@keyframes clockChime{to{transform:rotate(.8deg)}}

/* ---------- Starlight hourglass 2.0 ---------- */
.machine{width:min(470px,84vw);aspect-ratio:.88}.hg2-aura{position:absolute;left:7%;top:1%;width:86%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,241,196,.14),rgba(215,201,244,.1) 42%,transparent 68%);animation:auraBreathe 3.8s ease-in-out infinite alternate}.hg2-orbit{position:absolute;left:5%;top:3%;width:90%;aspect-ratio:1;border:1px solid rgba(168,121,63,.18);border-radius:50%;transform:rotate(-18deg);opacity:.58}.hg2-orbit:before,.hg2-orbit:after{content:"";position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d8b56a 48%,#a8793f);box-shadow:0 0 9px rgba(216,181,106,.38)}.hg2-orbit:before{width:10px;height:10px;left:10%;top:18%}.hg2-orbit:after{width:6px;height:6px;right:8%;bottom:25%;background:radial-gradient(circle at 35% 30%,#fff,#d7c9f4 52%,#9a82cb)}.machine.running .hg2-orbit{animation:orbit2 18s linear infinite}.machine.done .hg2-orbit{opacity:1;border-color:rgba(216,181,106,.52);filter:drop-shadow(0 0 9px rgba(216,181,106,.42))}@keyframes orbit2{to{transform:rotate(342deg)}}@keyframes auraBreathe{to{transform:scale(1.06);opacity:.54}}

.hg2-cap{position:absolute;z-index:8;left:0;width:100%;height:11%;border-radius:50%;background:linear-gradient(100deg,#79552e 0,#f4deaa 18%,#a8793f 42%,#76502a 65%,#d8b56a 88%,#79552e);border:1px solid rgba(255,255,255,.52);box-shadow:inset 0 3px 3px rgba(255,255,255,.48),inset 0 -4px 6px rgba(71,43,14,.34),0 8px 14px rgba(86,59,17,.22)}.hg2-cap.top{top:0}.hg2-cap.bottom{bottom:0}.hg2-cap:after{content:"";position:absolute;left:8%;right:8%;top:27%;height:25%;border-radius:999px;background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(244,222,170,.72),rgba(255,255,255,.05))}
.hg2-frame{position:absolute;z-index:2;top:7%;bottom:7%;width:5%;border-radius:999px;background:linear-gradient(90deg,#684522,#d8b56a 46%,#8f6331);box-shadow:0 3px 9px rgba(78,50,10,.28),inset 1px 0 1px rgba(244,222,170,.45)}.hg2-frame.left{left:4%;transform:rotate(3deg)}.hg2-frame.right{right:4%;transform:rotate(-3deg)}
.hg2-glass{position:absolute;z-index:4;left:12%;right:12%;top:8%;bottom:8%;filter:drop-shadow(0 10px 15px rgba(76,60,38,.12))}.hg2-glass:before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,.88) 2%,rgba(209,227,240,.22) 24%,rgba(255,255,255,.08) 54%,rgba(198,215,231,.32) 76%,rgba(255,255,255,.65));clip-path:polygon(1% 0,99% 0,95% 20%,78% 38%,56% 49%,78% 62%,95% 80%,99% 100%,1% 100%,5% 80%,22% 62%,44% 51%,22% 38%,5% 20%);border-radius:38px}.hg2-glass:after{content:"";position:absolute;inset:2px;background:linear-gradient(96deg,rgba(255,255,255,.64),transparent 19% 72%,rgba(255,255,255,.28));clip-path:polygon(4% 1%,96% 1%,92% 20%,75% 37%,53% 48%,75% 63%,92% 80%,96% 99%,4% 99%,8% 80%,25% 63%,47% 52%,25% 37%,8% 20%)}
.hg2-chamber{position:absolute;z-index:3;left:19%;right:19%;overflow:hidden}.hg2-chamber.top{top:12%;height:35%;clip-path:polygon(0 0,100% 0,92% 23%,69% 72%,54% 100%,46% 100%,31% 72%,8% 23%)}.hg2-chamber.bottom{bottom:12%;height:35%;clip-path:polygon(46% 0,54% 0,69% 28%,92% 77%,100% 100%,0 100%,8% 77%,31% 28%)}.hg2-sand{position:absolute;inset:0;background:linear-gradient(120deg,#f3f1fb,#cbd8ed 38%,#b6add8 68%,#8f88bf);box-shadow:inset 8px 0 16px rgba(255,255,255,.48),inset -8px -4px 13px rgba(75,72,125,.16),0 0 9px rgba(183,194,226,.3)}.hg2-chamber.top .hg2-sand{transform:translateY(calc((1 - var(--sand-progress,1)) * 100%));transition:transform .35s linear}.hg2-chamber.bottom .hg2-sand{transform:translateY(calc(var(--sand-progress,1) * 100%));transition:transform .35s linear}.hg2-chamber.top .hg2-sand:before,.hg2-chamber.bottom .hg2-sand:before{content:"";position:absolute;left:-10%;right:-10%;height:24%;border-radius:50%;background:linear-gradient(90deg,#9a91c7,#eef1fa 48%,#b9cbe5)}.hg2-chamber.top .hg2-sand:before{top:-10%}.hg2-chamber.bottom .hg2-sand:before{top:-9%}
.hg2-stream{position:absolute;z-index:7;left:calc(50% - 1.5px);top:45%;width:3px;height:28%;border-radius:999px;background:linear-gradient(#9a91c7,#e7eaf7 55%,rgba(185,203,229,.22));opacity:0;filter:drop-shadow(0 0 4px rgba(154,145,199,.6))}.machine.running .hg2-stream{opacity:1;animation:sandStream .38s linear infinite alternate}@keyframes sandStream{to{transform:scaleX(.55);opacity:.72}}
.hg2-grains{position:absolute;z-index:8;inset:0;pointer-events:none}.hg2-grains i{position:absolute;left:50%;top:48%;width:3px;height:3px;border-radius:50%;background:#eef1fa;box-shadow:0 0 4px rgba(154,145,199,.48);opacity:0}.machine.running .hg2-grains i{animation:grainFall 1.15s linear infinite}.machine.running .hg2-grains i:nth-child(2){margin-left:-4px;animation-delay:-.33s}.machine.running .hg2-grains i:nth-child(3){margin-left:3px;animation-delay:-.72s}.machine.running .hg2-grains i:nth-child(4){margin-left:1px;animation-delay:-.95s}@keyframes grainFall{0%{opacity:0;transform:translateY(-7px)}18%{opacity:1}100%{opacity:0;transform:translateY(74px)}}
.hg2-sparkles i{position:absolute;z-index:9;width:5px;height:5px;border-radius:50%;background:#d8b56a;box-shadow:0 0 10px #efd48f;animation:twinkle2 1.8s ease-in-out infinite alternate}.hg2-sparkles i:nth-child(1){left:15%;top:23%}.hg2-sparkles i:nth-child(2){right:13%;top:38%;animation-delay:-.6s}.hg2-sparkles i:nth-child(3){left:11%;bottom:27%;animation-delay:-1.1s}.hg2-sparkles i:nth-child(4){right:9%;bottom:15%;animation-delay:-.35s}@keyframes twinkle2{to{opacity:.18;transform:scale(.42)}}
.hg2-time{position:absolute;z-index:10;left:8%;right:8%;top:78%;height:15%;border-radius:999px;background:rgba(255,253,248,.95);border:1px solid rgba(216,181,106,.55);box-shadow:inset 0 5px 14px rgba(94,70,28,.07),0 10px 20px rgba(94,70,28,.1);display:flex;align-items:center;justify-content:center;font:600 clamp(44px,6.5vw,70px)/1 var(--latin);letter-spacing:.04em;font-variant-numeric:tabular-nums}.hg2-time .colon{color:var(--gold2);animation:blink 1s steps(1) infinite}.paused .hg2-time .colon{animation:none}.machine.done .hg2-aura{animation:finishAura 1.4s ease-out 2}@keyframes finishAura{50%{transform:scale(1.22);background:radial-gradient(circle,rgba(255,236,174,.48),rgba(215,201,244,.24) 45%,transparent 70%)}}
@media(max-width:850px){.app{padding:20px 16px}.main{grid-template-columns:1fr}.stage{min-height:590px}.panel{min-height:420px}.top{align-items:flex-start}.sound span{display:none}}@media(max-width:520px){.brand h1{font-size:25px}.stage{min-height:510px;padding-inline:10px}.machine{width:370px;max-width:100%}.clock{font-size:47px}.controls{gap:7px}.btn{height:48px;padding:0 16px}.primary{min-width:140px}.panel{padding:22px}.complete-card{padding:30px 22px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}

<body>
<div class="sparkles"></div><canvas id="confetti"></canvas>
<main class="app">
  <header class="top"><div class="brand"><div class="eyebrow">A quiet moment among the stars</div><h1>星光沙漏計時器 2.0</h1><div class="sub">Starlight Hourglass Timer</div></div><button class="sound" id="sound" aria-pressed="true"><i></i><span>音效開啟</span></button></header>
  <section class="main">
    <article class="card stage">
      <div class="status" id="status"><i></i><span>準備開始</span></div>
      <div class="machine paused" id="machine"><div class="hg2-aura"></div><div class="hg2-orbit"></div><div class="hg2-sparkles"><i></i><i></i><i></i><i></i></div><div class="hg2-shell"><div class="hg2-cap top"></div><div class="hg2-frame left"></div><div class="hg2-frame right"></div><div class="hg2-glass"></div><div class="hg2-chamber top"><div class="hg2-sand"></div></div><div class="hg2-chamber bottom"><div class="hg2-sand"></div></div><div class="hg2-stream"></div><div class="hg2-grains"><i></i><i></i><i></i><i></i></div><div class="hg2-cap bottom"></div></div><div class="hg2-time" aria-live="polite"><span id="hh">00</span><span class="colon">:</span><span id="mm">05</span><span class="colon">:</span><span id="ss">00</span></div></div>
      <div class="controls"><button class="btn" id="reset">重設</button><button class="btn primary" id="start">開始計時</button><button class="btn" id="add">＋1 分鐘</button></div>
    </article>
    <aside class="card panel"><h2>設定時間</h2><div class="en">Set your focus time</div>
      <div class="field"><label class="label">自訂倒數時間</label><div class="time-inputs"><input id="hIn" type="number" min="0" max="99" value="0" aria-label="小時"><b>:</b><input id="mIn" type="number" min="0" max="59" value="5" aria-label="分鐘"><b>:</b><input id="sIn" type="number" min="0" max="59" value="0" aria-label="秒"></div><div class="unit-row"><span>小時</span><span>分鐘</span><span>秒</span></div></div>
      <div class="field"><span class="label">快速選擇</span><div class="presets"><button class="preset" data-min="1">1 min</button><button class="preset" data-min="5">5 min</button><button class="preset" data-min="15">15 min</button><button class="preset" data-min="25">25 min</button><button class="preset" data-min="45">45 min</button><button class="preset" data-min="60">60 min</button></div></div>
      <div class="divider"></div><div class="tip"><strong>小提醒 · Gentle reminder</strong>按下開始後，上層沙堆會依照剩餘時間逐漸下降，下層同步堆積；時間到時沙漏會翻轉並綻放星光。</div>
      <div class="progress"><div class="track"><div class="bar" id="bar"></div></div><p id="progressText">尚未開始 · READY WHEN YOU ARE</p></div>
    </aside>
  </section>
</main>
<div class="complete" id="complete" role="dialog" aria-modal="true"><div class="complete-card"><div class="capsule-icon"></div><h3>時間到囉！</h3><div class="en">Your starlight moment is complete</div><p>完成一段專注時光，辛苦了。</p><button class="btn primary" id="again">再來一次</button></div></div>
<script>
(()=>{const $=s=>document.querySelector(s),els={h:$('#hh'),m:$('#mm'),s:$('#ss'),hi:$('#hIn'),mi:$('#mIn'),si:$('#sIn'),start:$('#start'),reset:$('#reset'),add:$('#add'),machine:$('#machine'),status:$('#status'),bar:$('#bar'),pt:$('#progressText'),sound:$('#sound'),complete:$('#complete'),again:$('#again')};let total=300,left=300,end=0,timer=null,running=false,soundOn=true,audio=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,Number(v)||0)),fmt=n=>String(n).padStart(2,'0');
function getInput(){els.hi.value=clamp(els.hi.value,0,99);els.mi.value=clamp(els.mi.value,0,59);els.si.value=clamp(els.si.value,0,59);return +els.hi.value*3600 + +els.mi.value*60 + +els.si.value}
function render(){const v=Math.max(0,Math.ceil(left));els.h.textContent=fmt(Math.floor(v/3600));els.m.textContent=fmt(Math.floor(v%3600/60));els.s.textContent=fmt(v%60);const progress=total?left/total:0;els.bar.style.width=progress*100+'%';els.machine.style.setProperty('--sand-progress',progress);document.title=(running?`${els.h.textContent}:${els.m.textContent}:${els.s.textContent} · `:'')+'星光沙漏計時器 2.0'}
function tone(kind){if(!soundOn)return;audio??=new (window.AudioContext||window.webkitAudioContext)();const now=audio.currentTime,notes=kind==='done'?[523,659,784,1047]:[520];notes.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=i%2?'sine':'triangle';o.frequency.setValueAtTime(f,now+i*.14);g.gain.setValueAtTime(.0001,now+i*.14);g.gain.exponentialRampToValueAtTime(kind==='done'?.13:.05,now+i*.14+.02);g.gain.exponentialRampToValueAtTime(.0001,now+i*.14+.34);o.connect(g).connect(audio.destination);o.start(now+i*.14);o.stop(now+i*.14+.36)})}
function setState(state){els.machine.className='machine '+(state==='running'?'running':state==='done'?'done':'paused');els.status.className='status '+state;els.status.querySelector('span').textContent=state==='running'?'星砂流動中':state==='done'?'沙漏已翻轉':state==='paused'?'計時已暫停':'準備開始'}
function tick(){left=Math.max(0,(end-performance.now())/1000);render();if(left<=0)finish()}
function start(){if(running){running=false;clearInterval(timer);left=Math.max(0,(end-performance.now())/1000);els.start.textContent='繼續計時';setState('paused');els.pt.textContent='暫停中 · TAKE A BREATH';return}if(left<=0||left===total){total=getInput();left=total}if(total<=0){els.si.value=10;total=left=10}running=true;end=performance.now()+left*1000;timer=setInterval(tick,200);els.start.textContent='暫停';setState('running');els.pt.textContent='專注進行中 · KEEP GOING';tone('start');tick()}
function reset(){clearInterval(timer);running=false;total=getInput()||300;left=total;els.start.textContent='開始計時';setState('ready');els.pt.textContent='尚未開始 · READY WHEN YOU ARE';els.complete.classList.remove('show');render()}
function finish(){clearInterval(timer);running=false;left=0;render();els.start.textContent='重新開始';setState('done');els.pt.textContent='完成 · WELL DONE';tone('done');confetti();setTimeout(()=>els.complete.classList.add('show'),700)}
function setPreset(min){els.hi.value=Math.floor(min/60);els.mi.value=min%60;els.si.value=0;reset()}
function confetti(){const c=$('#confetti'),x=c.getContext('2d'),d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;x.scale(d,d);const colors=['#f6c8d6','#bfe7dd','#d7c9f4','#c6e4f7','#d8b56a'],p=Array.from({length:110},()=>({x:innerWidth/2+(Math.random()-.5)*180,y:innerHeight*.35,vx:(Math.random()-.5)*10,vy:-Math.random()*9-3,r:Math.random()*6+3,c:colors[Math.floor(Math.random()*colors.length)],a:Math.random()*6}));let n=0;(function f(){x.clearRect(0,0,innerWidth,innerHeight);p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.22;q.a+=.12;x.save();x.translate(q.x,q.y);x.rotate(q.a);x.fillStyle=q.c;x.fillRect(-q.r,-q.r/2,q.r*2,q.r);x.restore()});if(n++<180)requestAnimationFrame(f);else x.clearRect(0,0,innerWidth,innerHeight)})()}
els.start.onclick=start;els.reset.onclick=reset;els.add.onclick=()=>{left+=60;total+=60;if(running)end+=60000;render()};els.again.onclick=()=>{els.complete.classList.remove('show');reset()};els.sound.onclick=()=>{soundOn=!soundOn;els.sound.setAttribute('aria-pressed',soundOn);els.sound.querySelector('span').textContent=soundOn?'音效開啟':'音效關閉';if(soundOn)tone('start')};document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>setPreset(+b.dataset.min));[els.hi,els.mi,els.si].forEach(i=>i.onchange=reset);document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|BUTTON/.test(e.target.tagName)){e.preventDefault();start()}if(e.key==='Escape')els.complete.classList.remove('show')});reset();
})();
</script>
